<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MFL — My Football Life</title>
<style>
:root{--bg:#0b1220;--card:#16213a;--ac:#22c55e;--tx:#e8eefc;--mu:#8fa0c4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
#app{max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column}
#main{flex:1;overflow:auto;padding:14px}
h1{margin:6px 0;font-size:26px}h2{margin:4px 0 8px;font-size:19px}.mu{color:var(--mu);font-size:13px}
.c{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.b{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--ac);color:#04210f;margin:8px 0}
.b.s{background:#26365c;color:var(--tx)}.b:disabled{opacity:.4}
.bar{height:8px;background:#0007;border-radius:4px;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ovr{font-size:54px;font-weight:800;color:var(--ac);line-height:1}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #33456f;background:#0d1730;color:var(--tx);font-size:16px}
.pos{display:flex;gap:8px;margin:10px 0}.pos button{flex:1;padding:12px 4px;border-radius:12px;border:2px solid #26365c;background:0;color:var(--tx);font-weight:700}.pos .on{border-color:var(--ac);color:var(--ac)}
nav{display:flex;overflow-x:auto;flex:none;background:#0f1a30;border-top:1px solid #22304f;scrollbar-width:thin}nav button{flex:0 0 60px;min-width:60px}nav button{flex:1;background:0;border:0;color:var(--mu);padding:10px 0;font-size:12px}nav button b{display:block;font-size:20px}nav .on{color:var(--ac)}
#ov{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9}#ov.on{display:flex}
canvas{display:block;touch-action:none}
#oc{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:420px;margin:auto;background:#101a30ee;border:1px solid #2c3d66;border-radius:20px;padding:20px;text-align:center}
.tag{display:inline-block;background:#26365c;border-radius:8px;padding:2px 8px;font-size:12px;margin-right:4px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--ac);color:#04210f;font-weight:700;padding:8px 16px;border-radius:20px;display:none;z-index:20}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.ev{padding:7px 9px;border-radius:10px;margin:5px 0;font-size:14px;background:#16213a}.ev b{color:var(--mu)}.evg{background:#14532d}.evb{background:#7f1d1d}.evo{background:#3b2f10}.evp{background:#12304a}.row .b{margin:4px 0}
.c{background:linear-gradient(160deg,#18243f,#101a30);border:1px solid #243558;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 14px #0005}
.hero{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;background:linear-gradient(135deg,#14532d,#0f2a4d);border:1px solid #2c5a7a;margin:8px 0}.hero h1{margin:0;font-size:22px}.hero .tag{margin-top:6px}
.av{width:52px;height:52px;border-radius:50%;background:var(--ac);color:#04210f;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.t2{grid-template-columns:1fr 1fr}.tile{background:#0d1730;border:1px solid #22304f;border-radius:14px;padding:10px 4px;text-align:center;font-size:12px}.tile b{display:block;font-size:17px;margin-top:2px}
.sb{display:grid;grid-template-columns:132px 1fr 30px;gap:8px;align-items:center;margin:7px 0;font-size:13px}.sb .bar{margin:0}.sb b{text-align:right}
.vs{display:flex;justify-content:space-around;align-items:center;text-align:center;margin:10px 0}
nav{padding-bottom:env(safe-area-inset-bottom,0)}nav .on{background:linear-gradient(#0000,#16a34a26)}nav .on b{transform:scale(1.18)}
.sbd{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:20px;background:linear-gradient(135deg,#0f2a4d,#14532d);border:1px solid #2c5a7a;margin:8px 0}.tm{text-align:center;width:30%;font-size:12px}.cr{width:44px;height:44px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;border:2px solid #fff6}
.tb{display:grid;grid-template-columns:24px 1fr 28px 36px 32px;gap:4px;font-size:13px;padding:6px 6px;border-radius:8px}.tb.me{background:#16a34a33;font-weight:700}.tb span:nth-child(n+3),.tb b{text-align:right}
.ev{border-left:3px solid #334a7a}.evg{border-left-color:#22c55e}.evb{border-left-color:#ef4444}.evo{border-left-color:#f59e0b}
.top{position:sticky;top:-1px;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 4px;background:linear-gradient(var(--bg) 80%,#0000)}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--v)*1%),#1b2a4a 0);display:flex;align-items:center;justify-content:center;position:relative;margin:auto}.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#0d1730}.ring b{position:relative;z-index:1;font-size:22px}
svg text{fill:#cbd5e1}.pos button{line-height:1.3}

#splash{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:spOut .8s ease 2.8s forwards}
#splash .lg{font-size:30px;font-weight:300;letter-spacing:.35em;text-transform:uppercase;color:#fff;opacity:0;animation:spIn 1.4s ease .3s forwards;text-align:center;padding:0 16px}
#splash .lg b{font-weight:800;color:#22c55e}
#splash .ln{height:2px;width:0;background:linear-gradient(90deg,#0000,#22c55e,#0000);margin-top:18px;animation:spLn 1.6s ease .8s forwards}
#splash .sm{margin-top:14px;font-size:11px;letter-spacing:.5em;color:#6b7280;opacity:0;animation:spIn 1s ease 1.4s forwards}
@keyframes spIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spLn{to{width:70%}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
.hero.st{position:relative;overflow:hidden;padding:34px 16px 28px;background:radial-gradient(circle at 50% 0,#22c55e55,#0000 60%),linear-gradient(160deg,#0a3d22,#0b1f3d);box-shadow:0 10px 30px #0008}
.hero.st h1{font-size:34px;letter-spacing:.04em;font-weight:900}
.hero.st .ball{font-size:68px;filter:drop-shadow(0 8px 12px #000a);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.pub{text-align:center;margin:22px 0 8px;font-size:11px;letter-spacing:.35em;color:#5d6b8c;text-transform:uppercase}.pub b{color:#22c55e}
.pos button{transition:.15s}.pos .on{background:#22c55e1f;box-shadow:0 0 14px #22c55e55}
.b{box-shadow:0 6px 16px #22c55e44;letter-spacing:.03em}.b.s{box-shadow:none}

body{background:#070d1a}
.stad{position:relative;overflow:hidden;border-radius:26px;padding:38px 18px 26px;text-align:center;background:radial-gradient(ellipse at 20% -10%,#fde68a55,#0000 45%),radial-gradient(ellipse at 80% -10%,#93c5fd55,#0000 45%),linear-gradient(180deg,#0a1f3a,#0b3a22 70%,#0a5a2c);border:1px solid #2c5a7a;box-shadow:0 14px 40px #000a}
.stad::before{content:"";position:absolute;inset:auto -10% 0 -10%;height:46%;background:repeating-linear-gradient(90deg,#ffffff0a 0 40px,#0000 40px 80px);transform:perspective(200px) rotateX(55deg);transform-origin:bottom}
.stad>*{position:relative}
.stad .ball{font-size:64px;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 10px 10px #000a)}
.stad h1{font-size:38px;margin:6px 0 0;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(#fff,#86efac);-webkit-background-clip:text;background-clip:text;color:transparent}
.stad p{margin:6px 0 0;color:#c7d6f5;font-size:14px}
.stad .ver{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:20px;background:#0006;border:1px solid #ffffff22;font-size:11px;letter-spacing:.2em;color:#86efac}
.sec{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7f93bd;margin:20px 4px 8px;font-weight:700}
.nin{display:flex;align-items:center;gap:12px;background:#0d1730;border:1px solid #2a3c66;border-radius:16px;padding:6px 14px}
.nin span{font-size:22px}.nin input{border:0;background:0;padding:10px 0;font-size:18px;font-weight:700}.nin input:focus{outline:0}
.nin:focus-within{border-color:#22c55e;box-shadow:0 0 0 3px #22c55e33}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pc .ic{font-size:30px}.pc b{display:block;font-size:16px;margin-top:6px}.pc small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.pc.on{border-color:#22c55e;background:linear-gradient(160deg,#14532d,#0d1730);box-shadow:0 0 18px #22c55e55;transform:scale(1.02)}
.pc.on::after{content:"✓";position:absolute;top:8px;right:10px;color:#22c55e;font-weight:900}
.cta{font-size:18px;padding:17px;border-radius:18px;background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 8px 24px #22c55e55,inset 0 1px #fff6}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid #2c5a7a;background:linear-gradient(135deg,#0f2a4d,#14532d);color:var(--tx);border-radius:18px;padding:12px 14px;margin:8px 0}

.scout{display:flex;gap:12px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,#3b2f10,#0f2a4d);border:1px solid #f59e0b66;margin:6px 0 4px}
.scout .e{font-size:38px}.scout h1{margin:0;font-size:22px}.scout p{margin:3px 0 0;color:#d6c9a0;font-size:13px}
.dr{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;margin:10px 0;background:linear-gradient(160deg,#18243f,#101a30);border:1px solid #243558}
.dr .n{width:28px;height:28px;border-radius:50%;background:#22c55e;color:#04210f;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.dr .i{font-size:30px;width:52px;height:52px;border-radius:14px;background:#0d1730;display:flex;align-items:center;justify-content:center;flex:none}
.dr b{display:block;font-size:16px}.dr small{color:var(--mu);font-size:12px}
.hint{text-align:center;color:#7f93bd;font-size:12px;margin:10px 0}
.oc{position:relative;overflow:hidden;border-radius:22px;padding:16px;margin:14px 0;background:linear-gradient(160deg,#18243f,#0d1730);border:1px solid #2a3c66;box-shadow:0 8px 22px #0007}
.oc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cc)}

.oc h2{margin:0;font-size:19px}.oc .sal{font-size:22px;font-weight:800;color:#4ade80}

.rib{position:absolute;top:12px;right:-30px;transform:rotate(35deg);background:#f59e0b;color:#2b1d00;font-size:10px;font-weight:900;padding:3px 34px;letter-spacing:.1em}

.avi{border-radius:50%;object-fit:contain;background:radial-gradient(#22c55e55,#0d1730);border:2px solid #22c55e;flex:none}
.cprev{position:relative;height:310px;border-radius:26px;overflow:hidden;background-size:cover,180px;display:flex;align-items:flex-end;justify-content:center;border:1px solid #2c5a7a;box-shadow:0 10px 30px #0008}
.cprev img{height:268px;margin-bottom:12px;filter:drop-shadow(0 10px 8px #000a)}
.cnm{position:absolute;top:12px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:.06em;text-shadow:0 2px 6px #000}
.ctabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 8px;padding-bottom:4px}.ctabs button{flex:none;padding:10px 12px;border-radius:14px;border:2px solid #22304f;background:#0d1730;color:var(--tx);font-weight:700;font-size:13px}.ctabs .on{border-color:#22c55e;color:#4ade80;background:#14532d55}
.og{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.og button{aspect-ratio:1;border-radius:14px;border:2px solid #22304f;background:#0d1730;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx)}.og button.tall{aspect-ratio:auto;padding:6px 2px;height:128px}.og button.on{border-color:#22c55e;box-shadow:0 0 12px #22c55e66;background:#14532d44}
.og img{max-width:100%;max-height:100%;object-fit:contain;min-height:0}.og .tall img{max-height:96px}.og small{font-size:10px;color:var(--mu);margin-top:2px}.sw{width:70%;aspect-ratio:1;border-radius:50%;border:2px solid #000}
.og.kg{grid-template-columns:repeat(5,1fr)}.og.kg button{aspect-ratio:3/4}
.sets{display:flex;gap:6px;margin-bottom:8px}.sets button{flex:1;padding:8px 2px;border-radius:12px;border:2px solid #22304f;background:#0d1730;color:var(--tx);font-size:12px;font-weight:700}.sets .on{border-color:#22c55e;color:#4ade80}
.pal{display:flex;gap:6px;margin:6px 0 10px}.pal button{flex:1;aspect-ratio:1;border-radius:50%;border:2px solid #000}.pal .on{outline:3px solid #fff}
.fac{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:8px;border-radius:14px;background:#0d1730}.fac img{height:34px;object-fit:contain}.fac .ff{height:38px;border-radius:6px}.fac .mu{margin-left:auto;font-size:11px}
.bodycard{display:flex;gap:14px;align-items:center}.bodycard img{height:190px;filter:drop-shadow(0 8px 6px #000a)}

.navcount{display:inline-block;min-width:16px;padding:1px 4px;margin-left:2px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:800}
.wtabs,.ctabs2{display:flex;gap:6px;overflow-x:auto;padding:3px 1px 8px;scrollbar-width:thin}
.wtabs button,.ctabs2 button{flex:none;border:1px solid #2b3d63;background:#0d1730;color:var(--tx);padding:8px 11px;border-radius:12px;font-size:12px;font-weight:700}
.wtabs button.on,.ctabs2 button.on{border-color:var(--ac);color:#4ade80;background:#14532d55}
.league-row{display:grid;grid-template-columns:24px minmax(0,1fr) 32px 34px 34px;gap:5px;align-items:center;padding:8px 6px;border-radius:9px;font-size:12px}
.league-row.me{background:#16a34a30;font-weight:800}
.zone{font-size:9px;display:inline-block;padding:2px 5px;border-radius:5px;margin-left:4px;background:#334155;color:#e2e8f0;white-space:nowrap}
.zone.up{background:#14532d;color:#86efac}.zone.po{background:#713f12;color:#fde68a}.zone.eu{background:#1e3a8a;color:#bfdbfe}.zone.down{background:#7f1d1d;color:#fecaca}
.mailitem{padding:12px;border:1px solid #293b61;border-radius:14px;background:#0d1730;margin:8px 0}
.mailitem.unread{border-color:#22c55e;background:linear-gradient(120deg,#14532d44,#0d1730)}
.mailitem .subject{font-weight:800}.mailitem .from{font-size:11px;color:var(--mu);margin-bottom:4px}
.eventline{display:grid;grid-template-columns:54px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #253454;font-size:13px}
.eventline:last-child{border:0}.eventdate{color:#93c5fd;font-weight:800}.eventline.done{opacity:.55}.eventline.now{background:#16a34a20;border-radius:10px;padding-left:8px}
.trophy{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #3b4b70;background:#0d1730;border-radius:13px;margin:7px 0}
.trophy .cup{font-size:30px}.trophy b{display:block}.trophy small{color:var(--mu)}

/* MFL Training Centre */
.tr-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:154px;padding:20px;border:1px solid #2e5b63;border-radius:22px;background:radial-gradient(circle at 85% 15%,#34d39935,transparent 34%),linear-gradient(125deg,#102f35 0%,#10213b 58%,#0a1728 100%);box-shadow:0 12px 28px #0006;margin:8px 0 14px}
.tr-hero:after{content:"";position:absolute;right:-38px;bottom:-78px;width:210px;height:210px;border:1px solid #9ce9c52b;border-radius:50%;box-shadow:0 0 0 18px #9ce9c510,0 0 0 38px #9ce9c508}
.tr-hero-copy{position:relative;z-index:1;max-width:72%}.tr-eyebrow{font-size:10px;letter-spacing:.22em;font-weight:900;color:#70dcb2}.tr-heading{font-size:25px;line-height:1.08;font-weight:900;letter-spacing:-.025em;margin:8px 0}.tr-sub{font-size:12px;line-height:1.5;color:#b8cbd7;max-width:270px}.tr-fieldmark{position:relative;z-index:1;width:92px;height:116px;flex:none;border:2px solid #b9e5d966;border-radius:10px;transform:perspective(220px) rotateY(-13deg);background:linear-gradient(90deg,#ffffff0c 49%,#ffffff35 50%,#ffffff0c 51%),repeating-linear-gradient(0deg,#ffffff08 0 18px,#ffffff00 18px 36px),linear-gradient(145deg,#27684b,#123a32);box-shadow:0 10px 25px #0008}
.tr-fieldmark:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #ffffff88}.tr-fieldmark:after{content:"";position:absolute;left:25%;right:25%;top:35%;aspect-ratio:1;border:1px solid #ffffff88;border-radius:50%}
.tr-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}.tr-metric{padding:11px 10px;border-radius:15px;background:linear-gradient(150deg,#172943,#0e1a2c);border:1px solid #263b57;min-width:0}.tr-metric small{display:block;font-size:9px;font-weight:800;letter-spacing:.11em;color:#8da5bd;text-transform:uppercase}.tr-metric b{display:block;font-size:20px;margin:4px 0 0;font-variant-numeric:tabular-nums}.tr-metric .tr-mini-bar{height:4px;background:#07111f;border-radius:8px;overflow:hidden;margin-top:7px}.tr-metric .tr-mini-bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#22c55e,#8be6b2)}
.tr-week{padding:13px;border:1px solid #263954;border-radius:17px;background:#101d30;margin:10px 0 14px}.tr-week-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.tr-week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.tr-day{padding:8px 2px 7px;text-align:center;border-radius:10px;background:#0a1423;border:1px solid #20324b;color:#7f95ac;font-size:10px}.tr-day b{display:block;color:#dce8f3;font-size:11px;margin-bottom:5px}.tr-day.active{border-color:#397b68;background:#163c35;color:#91dfbe}.tr-day.done{border-color:#2e9b70;background:linear-gradient(145deg,#14563e,#102b32);color:#b5f2d2}.tr-day .tr-dot{display:block;width:7px;height:7px;border-radius:50%;margin:5px auto 0;background:#3a5064}.tr-day.active .tr-dot{background:#59d69b}.tr-day.done .tr-dot{background:#b5f2d2;box-shadow:0 0 8px #64e2a0}
.tr-tabs{display:flex;gap:7px;overflow-x:auto;padding:3px 1px 9px;scrollbar-width:none}.tr-tabs::-webkit-scrollbar{display:none}.tr-tabs button{flex:none;padding:9px 13px;border-radius:12px;border:1px solid #2a3d58;background:#101d30;color:#aabbd0;font-size:12px;font-weight:800}.tr-tabs button.on{border-color:#46bd8d;background:linear-gradient(135deg,#15533d,#123148);color:#d8ffeb;box-shadow:0 4px 13px #16a34a22}
.tr-section-title{display:flex;align-items:end;justify-content:space-between;gap:8px;margin:10px 3px}.tr-section-title h2{font-size:17px;margin:0}.tr-section-title small{color:#849bb4;font-size:10px}

function careerEnsure(){
 if(!S)return;S.careerHistory=Array.isArray(S.careerHistory)?S.careerHistory:[];
 if(!S.careerHistoryMigrated){
  (Array.isArray(S.hist)?S.hist:[]).forEach((raw,i)=>{
   const line=String(raw||"").trim();if(!line)return;
   const season=Number((line.match(/^(\d+)\s*\.?\s*sezon/i)||[])[1])||Math.max(1,(S.season||1)-1);
   let x;
   if(line.includes("→")){const p=line.split("→").map(v=>v.trim());x={type:"transfer",season,club:p[1]||S.club?.n,from:p[0].replace(/^\d+\s*\.?\s*sezon:\s*/i,""),to:p[1],title:"Transfer gerçekleşti",detail:`${p[0]} → ${p[1]}`}}
   else if(line.includes("·")){const p=line.split("·").map(v=>v.trim());x={type:"season",season,club:p[1]||S.club?.n,league:p[0].replace(/^\d+\s*\.?\s*sezon:\s*/i,""),title:"Sezon / kulüp kaydı",detail:`${p[1]||""} · ${p[0]}`}}
   else{const club=line.replace(/^\d+\s*\.?\s*sezon:\s*/i,"");x={type:"join",season,club,title:"Kulübe katıldı",detail:`${club} kariyerine eklendi`}}
   if(!S.careerHistory.some(y=>y.season===x.season&&y.type===x.type&&y.club===x.club&&y.from===x.from&&y.to===x.to))S.careerHistory.push({...x,id:`legacy-${season}-${i}`});
  });
  S.careerHistoryMigrated=true;
 }
}

 const keepSocial=scr==="soc"&&m.dataset.lastScreen==="soc",savedScroll=m.scrollTop;m.innerHTML=(S&&S.club&&["home","train","match","soc","me","world","calendar","mail","trophies","clubView"].includes(scr)?TOP():"")+h;m.scrollTop=keepSocial?savedScroll:0;m.dataset.lastScreen=scr}

.soc-scene{display:flex;align-items:end;position:relative;isolation:isolate;padding:16px;background:radial-gradient(ellipse at 52% 28%,#b7e87340,transparent 44%),linear-gradient(165deg,#174f4c,#0c1b2b 66%,#122d1d)}

.soc-scene-academy{background:radial-gradient(circle at 50% 20%,#a5e87355,transparent 30%),linear-gradient(155deg,#215b49,#101d2a 75%)}

.soc-scene-copy small{font-size:9px;letter-spacing:.2em;color:#b9df8b;font-weight:900}
.soc-scene-copy b{font-size:24px;letter-spacing:-.03em;color:#fff;max-width:78%;line-height:1.1}
.soc-scene-copy span{font-size:8px;letter-spacing:.23em;color:#9fb4c0;margin-top:7px}
.soc-post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:9px 0 5px}

.soc-post-actions button.soc-liked,.soc-post-actions button.soc-liked span{color:#ff738e}
.soc-post-actions button.soc-saved,.soc-post-actions button.soc-saved span{color:#bce87a}
.soc-post-meta{display:flex;justify-content:space-between;border-bottom:1px solid #2a3b4d;padding:4px 1px 9px;font-size:10px;color:#91a5b8}

.soc-empty{text-align:center;padding:18px 10px;color:#90a4b7;font-size:11px;line-height:1.5;background:#101c2a;border:1px solid #293d50;border-radius:13px}
.soc-footer{text-align:center;color:#60778d;font-size:8px;letter-spacing:.15em;padding:16px 0 10px}
.soc-profile-page{min-width:0}.soc-back{border:0;background:none;color:#b6d58d;font-size:11px;font-weight:900;padding:8px 0}
.soc-profile-cover{height:120px;border-radius:16px 16px 0 0;background:linear-gradient(125deg,#284e39,#152d3c 60%,#213a58);border:1px solid #3d5948}

.soc-profile-cover.media-cover{background:linear-gradient(135deg,#1f4c78,#14263c 55%,#257a7c)}
.soc-profile-summary{display:flex;align-items:center;gap:10px;padding:0 12px;margin-top:-35px;position:relative}

.soc-profile-title{flex:1;min-width:0;padding-top:34px}.soc-profile-title b{display:block;font-size:13px;overflow-wrap:anywhere}.soc-profile-title small,.soc-profile-title span{display:block;color:#91a6b9;font-size:9px;margin-top:3px}
.soc-profile-follow,.soc-you-tag{flex:none;margin-top:34px;border:1px solid #8bb65b;border-radius:10px;padding:8px 10px;background:#29432e;color:#d8f1b3;font-size:10px;font-weight:900}

.soc-profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0 10px}
.soc-profile-stats>div{background:#0c1724;border:1px solid #293e52;border-radius:11px;padding:9px;text-align:center}
.soc-profile-stats b{display:block;font-size:14px}.soc-profile-stats small{display:block;color:#899eb1;font-size:9px;margin-top:3px}
.soc-profile-bio{font-size:10px;color:#b2c0cc;line-height:1.5;padding:5px 2px 13px}
.soc-profile-posts-title{padding:9px 2px;border-top:1px solid #2a3c50;color:#a9d87a;font-size:9px;font-weight:900;letter-spacing:.18em}

.soc-story-art{flex:1;min-height:55vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:24px;background:linear-gradient(145deg,#22543f,#102035);text-align:center}

.soc-story-caption{padding:13px;color:#e8f1f6;font-size:12px}
.soc-topline{display:flex;align-items:center;gap:14px}.soc-topline h2{margin:0}

@media(max-width:380px){
 .soc-heading h1{font-size:26px}.soc-live{font-size:8px;padding:7px 8px}
 .soc-tabs button{font-size:10px}.soc-suggestions{grid-template-columns:1fr}
 .soc-scene-copy b{font-size:21px}
}

/* PLAYER CREATION RESPONSIVE FIX */
#main{overflow-x:hidden;max-width:100vw}
.create-shell,.create-shell *{box-sizing:border-box}
.create-shell{width:100%;max-width:100%;min-width:0;overflow:hidden;padding:2px 0 26px}
.create-title{padding:4px 2px 12px}
.create-title>span{font-size:9px;color:#9bd34b;font-weight:900;letter-spacing:.17em}
.create-title h1{font-size:23px;margin:5px 0 4px;line-height:1.15}
.create-title p{font-size:11px;line-height:1.45;color:#94a8ba;margin:0}
.create-preview{position:relative;width:100%;height:clamp(245px,70vw,300px);max-height:300px;min-width:0;overflow:hidden;border-radius:20px;border:1px solid #3c6e55;background:linear-gradient(#07131d60,#07131d15 60%),url('') center/cover;background-color:#16472b;box-shadow:0 10px 25px #0005;display:flex;justify-content:center;align-items:flex-end}
.create-preview:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff06 0 2px,transparent 2px 45px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:auto,35px 100%;pointer-events:none}
.create-preview .cnm{position:absolute;z-index:2;top:13px;left:8px;right:8px;text-align:center;font-size:15px;font-weight:900;text-shadow:0 2px 7px #000b}
.create-preview img{position:relative;z-index:1;display:block;max-width:78%;max-height:calc(100% - 43px);height:auto;width:auto;object-fit:contain;margin:0 auto 5px;filter:drop-shadow(0 8px 8px #0008)}
.create-preview-foot{position:absolute;z-index:2;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:#e3f0e7;font-size:7px;letter-spacing:.16em;font-weight:900;text-shadow:0 2px 5px #000}
.create-country-card{margin:12px 0;padding:13px;border:1px solid #2b4256;border-radius:15px;background:linear-gradient(145deg,#172638,#0f1b29)}
.create-country-heading{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.create-country-heading b{font-size:13px}.create-country-heading small{font-size:9px;color:#8399ad}
.create-select-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.create-choice{display:flex;flex-direction:column;gap:6px;min-width:0}
.create-choice>span{font-size:10px;color:#b5c5d2;font-weight:800}
.create-choice select{width:100%;min-width:0;max-width:100%;height:42px;padding:0 8px;border-radius:10px;border:1px solid #3a5268;background:#0b1724;color:#f3f7f9;font-size:11px;font-weight:800;appearance:auto}
.create-choice small{font-size:8px;color:#8da3b6;line-height:1.35;min-height:22px}
.create-country-info{font-size:9px;line-height:1.45;color:#91a5b8;padding:9px 10px;margin-top:8px;background:#0b1724;border-radius:9px;border:1px solid #273d50}
.create-editor{background:#111e2c;border:1px solid #2a3e52;border-radius:15px;padding:12px;min-width:0;overflow:hidden}
.create-editor-heading{display:flex;flex-direction:column;gap:4px;margin:0 0 9px}
.create-editor-heading b{font-size:14px}.create-editor-heading small{font-size:9px;color:#8399ad}
.create-shell .ctabs{display:flex;gap:6px;max-width:100%;width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:2px 1px 9px;margin:0 0 5px;overscroll-behavior-x:contain}
.create-shell .ctabs::-webkit-scrollbar{display:none}

.create-shell #copts .og button{min-width:0;width:100%;aspect-ratio:1;border-radius:12px;border:1px solid #30465c;background:#0b1726;padding:4px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.create-shell #copts .og button.on{border:2px solid #9bd34b;background:linear-gradient(145deg,#29452e,#0e1c25);box-shadow:0 0 0 2px #9bd34b20}
.create-shell #copts .og img{display:block;width:100%;height:calc(100% - 18px);max-width:100%;max-height:calc(100% - 18px);min-height:0;object-fit:contain}
.create-shell #copts .og small{display:block;width:100%;font-size:9px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9fb1c0;margin-top:3px}
.create-shell #copts .og .sw{width:58%;height:auto;aspect-ratio:1;border-radius:50%}
.create-shell #copts .og.kg{grid-template-columns:repeat(5,minmax(0,1fr))}
